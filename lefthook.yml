pre-commit:
  parallel: true
  commands:
    js-syntax:
      run: bun run check:js
    rust-fmt:
      run: bun run check:rust:fmt
    plist:
      run: plutil -lint apps/desktop/src-tauri/AppMetadata.plist apps/desktop/src-tauri/Info.plist PreviewExtension/Info.plist PreviewExtension/BurettePreview.entitlements

pre-push:
  commands:
    # Hosted CI runs ci:fast for every PR; running it here too took about
    # eight minutes of this Mac per push. Only the instant version check stays.
    release-version:
      run: bun run check:release
