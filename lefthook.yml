pre-commit:
  parallel: true
  commands:
    js-syntax:
      run: bun run check:js
    rust-fmt:
      run: bun run check:rust:fmt
    plist:
      run: plutil -lint apps/desktop/src-tauri/AppMetadata.plist apps/desktop/src-tauri/Info.plist PreviewExtension/Info.plist PreviewExtension/BurettePreview.entitlements

pre-push:
  commands:
    ci-fast:
      run: bun run ci:fast
