<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burrete Molecular Workspace</title>
  <style>/* __BURETTE_AGENT_WIDGET_CSS__ */</style>
</head>
<body>
  <main class="shell" data-widget="molecular-workspace">
    <header>
      <p class="eyebrow">Burrete</p>
      <h1 id="title">Molecular Workspace</h1>
      <p id="summary">Awaiting workspace payload.</p>
    </header>
    <section class="grid">
      <article class="panel">
        <h2>Active Document</h2>
        <dl id="document"></dl>
      </article>
      <article class="panel">
        <h2>Viewer Agent</h2>
        <dl id="viewer"></dl>
      </article>
      <article class="panel wide">
        <h2>Workspace Panels</h2>
        <ul id="panels"></ul>
      </article>
      <article class="panel wide">
        <h2>Recent Actions</h2>
        <ul id="actions"></ul>
      </article>
    </section>
  </main>
  <script>/* __BURETTE_AGENT_WIDGET_JS__ */</script>
</body>
</html>
