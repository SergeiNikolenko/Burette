[[permission]]
identifier = "allow-compute-commands"
description = "Allows trusted Burrete desktop windows to inspect and control durable local compute jobs."
commands.allow = [
  "compute_capabilities",
  "compute_submit_job",
  "compute_begin_cluster_execution",
  "compute_submit_fingerprint_chunk",
  "compute_execute_cluster",
  "compute_publish_cluster",
  "compute_get_job",
  "compute_list_jobs",
  "compute_cancel_job",
  "compute_get_artifact_manifest",
  "compute_export_cluster_representatives",
  "compute_find_similar",
  "compute_purge_job"
]
