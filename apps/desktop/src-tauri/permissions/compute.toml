[[permission]]
identifier = "allow-compute-commands"
description = "Allows trusted Burette desktop windows to inspect and control durable local compute jobs."
commands.allow = [
  "compute_capabilities",
  "compute_register_inline_source",
  "compute_align_grid_poses",
  "compute_evaluate_grid_semiempirical",
  "compute_submit_job",
  "compute_begin_conformer_submission",
  "compute_submit_conformer_chunk",
  "compute_execute_conformer_distance",
  "compute_execute_conformer_stereo",
  "compute_validate_conformer_reference",
  "compute_publish_conformer",
  "compute_begin_cluster_execution",
  "compute_submit_fingerprint_chunk",
  "compute_execute_cluster",
  "compute_execute_chemical_space",
  "compute_cluster_chemical_space",
  "compute_publish_cluster",
  "compute_get_job",
  "compute_list_jobs",
  "compute_cancel_job",
  "compute_get_artifact_manifest",
  "compute_export_cluster_representatives",
  "compute_find_similar",
  "compute_purge_job"
]
