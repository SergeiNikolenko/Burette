[[permission]]
identifier = "allow-viewer-commands"
description = "Allows the Burrete desktop shell to open structures and manage local viewer runtime state."
commands.allow = [
  "startup_documents",
  "pick_open_targets",
  "open_documents",
  "read_structure_text",
  "open_text_structure",
  "open_merged_collection",
  "grid_fetch_page",
  "render_xyzrender_sheet_item",
  "sync_viewer_preferences",
  "clear_preview_cache",
  "open_logs_folder",
  "open_external_url",
  "reset_quick_look",
  "install_update"
]
