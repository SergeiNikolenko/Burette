[[permission]]
identifier = "allow-viewer-commands"
description = "Allows the Burrete desktop shell to open structures and manage local viewer runtime state."
commands.allow = [
  "startup_documents",
  "pick_open_targets",
  "open_documents",
  "read_structure_text",
  "open_text_structure",
  "open_merged_collection",
  "open_delimited_grid_document",
  "save_text_as",
  "grid_fetch_page",
  "grid_close_runtime",
  "grid_append_records",
  "grid_delimited_columns",
  "grid_append_delimited_records",
  "render_xyzrender_sheet_item",
  "sync_viewer_preferences",
  "clear_preview_cache",
  "export_diagnostics_bundle",
  "open_logs_folder",
  "open_external_url",
  "read_external_preview_svg",
  "reveal_path",
  "write_base64_file",
  "write_text_file",
  "reset_quick_look",
  "install_update"
]
