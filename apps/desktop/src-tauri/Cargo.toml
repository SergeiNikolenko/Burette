[package]
name = "burette"
version = "2.0.3"
description = "Tauri/Rust shell for local molecular previews"
authors = ["Burette"]
edition = "2021"
default-run = "burette"

[lib]
name = "burette_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
burette-compute-metal = { path = "../../../crates/burette-compute-metal" }
burette-compute-core = { path = "../../../crates/burette-compute-core" }
burette-compute-protocol = { path = "../../../crates/burette-compute-protocol" }
burette-core = { path = "../../../crates/burette-core" }
ed25519-dalek = "3"
flate2 = "1"
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "test", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
core-foundation = "0.10"
dispatch2 = "0.3"
objc = "0.2"
