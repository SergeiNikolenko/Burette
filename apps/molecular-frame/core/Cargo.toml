[workspace]

[package]
name = "molecule-editor"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Rust/WebAssembly core of the LigandPro 2D chemical structure editor"

[lib]
name = "molecule_editor"
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmolkit-core = { git = "https://github.com/cosmol-studio/COSMolKit.git", rev = "252a1f3d6480fc4a0abcd51d76707f51f69b4406" }
wasm-bindgen = "=0.2.129"

[dev-dependencies]
serde_json = "1"

# "s" over "z": 3D generation runs 2.4x faster for ~10 % more compressed size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Native tests embed conformers and run force fields; keep the chemistry fast.
[profile.dev.package.cosmolkit-core]
opt-level = 3
