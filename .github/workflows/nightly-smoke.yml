name: Nightly macOS Smoke

on:
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch:

jobs:
  packaged-preview-smoke:
    name: Packaged App And Quick Look Smoke
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Burrete toolchain
        uses: ./.github/actions/setup-burrete-toolchain
        with:
          install-xyzrender: "true"

      - name: Build flavored app
        env:
          BURRETE_DEV_FLAVOR: ci
        run: ./scripts/build.sh

      - name: Verify bundle shape
        run: |
          codesign --verify --deep --strict build/Burrete-ci.app
          test -d build/Burrete-ci.app/Contents/PlugIns/BurretePreview.appex
          test -d build/Burrete-ci.app/Contents/PlugIns/BurreteThumbnail.appex

      - name: Install flavored app
        env:
          BURRETE_DEV_FLAVOR: ci
        run: ./scripts/install.sh

      - name: Run Quick Look smoke
        env:
          BURRETE_DEV_FLAVOR: ci
          BURRETE_QUICKLOOK_SMOKE_RESULTS: build/reports/nightly-quicklook-preview-smoke.tsv
          BURRETE_QUICKLOOK_SMOKE_TIMEOUT_SECONDS: 60
        run: |
          ./scripts/quicklook-preview-smoke.sh \
            samples/mini.pdb \
            samples/mini.cif \
            samples/mini.sdf \
            samples/mini.xyz \
            samples/quantum/inputs/caffeine.com

      - name: Run non-GUI perf smoke report
        env:
          BURRETE_APP_PATH: build/Burrete-ci.app
          BURRETE_PERF_REPORT: build/reports/nightly-perf-smoke.txt
          BURRETE_PERF_RUN_GUI: 0
          BURRETE_PERF_RUN_QUICKLOOK: 1
        run: ./scripts/perf-smoke.sh

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-smoke-reports
          path: build/reports
