name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  BURETTE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  changes:
    name: Detect Build Scope
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect native/package changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]] \
              || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              changed="$(git ls-tree -r --name-only HEAD)"
            else
              changed="$(git diff --name-only "$before" HEAD)"
            fi
          fi

          native=false
          while IFS= read -r path; do
            case "$path" in
              PreviewExtension/Web/*)
                ;;
              App/*|PreviewExtension/*|Burette.xcodeproj/*|apps/desktop/src-tauri/*|scripts/build*.sh|scripts/install*.sh|scripts/ci.sh|package.json|bun.lock)
                native=true
                ;;
            esac
          done <<< "$changed"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  validate:
    name: Fast PR Validation (${{ matrix.scope }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scope:
          - js
          - rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Burette toolchain
        uses: ./.github/actions/setup-burette-toolchain
        with:
          install-dependencies: "false"

      - name: Cache Rust build
        if: matrix.scope == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-validation

      - name: Use all runner cores for cargo
        if: matrix.scope == 'rust'
        run: echo "CARGO_BUILD_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

      - name: Run fast CI
        run: bash scripts/ci-fast.sh ${{ matrix.scope }}

  native-build:
    name: Native Bundle Build
    # Runs in parallel with fast validation; macOS minutes are free for this public repo.
    needs:
      - changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    env:
      # Keep the release target outside build.sh's throwaway source copy so it can be cached.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../burette-native-target
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Burette toolchain
        uses: ./.github/actions/setup-burette-toolchain
        with:
          install-xyzrender: "true"

      - name: Cache Rust release build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-release
          workspaces: ". -> ../burette-native-target"

      - name: Build native bundle
        env:
          BURETTE_DEV_FLAVOR: pr${{ github.event.number }}
          # Compile and package Sparkle without enabling updates in the dev namespace.
          BURETTE_SPARKLE_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: ./scripts/build.sh

      - name: Verify Sparkle signing and feed generation
        run: bun tests/test-sparkle-signing.mjs

      - name: Archive isolated app for native acceptance
        env:
          BURETTE_DEV_FLAVOR: pr${{ github.event.number }}
        run: |
          eval "$(bun scripts/dev-namespace.mjs shell-env)"
          ditto -c -k --sequesterRsrc --keepParent "build/$BURETTE_APP_BUNDLE_NAME" build/native-acceptance.zip

      - name: Upload native acceptance app
        uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-${{ github.event.number }}-${{ github.sha }}
          path: build/native-acceptance.zip
          retention-days: 7
