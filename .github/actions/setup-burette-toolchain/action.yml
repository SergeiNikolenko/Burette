name: Setup Burette Toolchain
description: Install the shared Bun and optional native preview tooling used by Burette workflows.

inputs:
  bun-version:
    description: Bun version to install.
    default: "1.4.2"
  install-dependencies:
    description: Run bun install with the frozen lockfile.
    default: "true"
  install-xyzrender:
    description: Install the xyzrender runtime through uv.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun packages
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Install xyzrender runtime
      if: inputs.install-xyzrender == 'true'
      shell: bash
      run: |
        python3 -m pip install --user --break-system-packages uv
        echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
        "$(python3 -m site --user-base)/bin/uv" tool install xyzrender
