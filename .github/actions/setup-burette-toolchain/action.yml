name: Setup Burette Toolchain
description: Install the shared Bun and optional native preview tooling used by Burette workflows.

inputs:
  bun-version:
    description: Bun version to install.
    default: "1.4.2"
  install-dependencies:
    description: Run bun install with the frozen lockfile.
    default: "true"
  install-xyzrender:
    description: Use the authenticated, locked xyzrender runtime for native builds.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Locate Bun download cache
      id: bun-cache
      shell: bash
      run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    - name: Cache Bun downloads
      uses: actions/cache@v6
      with:
        path: ${{ steps.bun-cache.outputs.path }}
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.bun-version }}-

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Install xyzrender runtime
      if: inputs.install-xyzrender == 'true'
      shell: bash
      run: |
        echo "BURETTE_BUILD_LOCKED_XYZRENDER=1" >> "$GITHUB_ENV"
