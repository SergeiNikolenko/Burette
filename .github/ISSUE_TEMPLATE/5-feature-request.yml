name: Feature Request
description: Propose a Burette feature or workflow improvement.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first and describe the workflow rather than only the implementation idea.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop app
        - Quick Look
        - Browser-dev
        - iPhone app
        - Agent/plugin/MCP
        - Release/install
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What molecular preview, editing, QA, or agent workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
