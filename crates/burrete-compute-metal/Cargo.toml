[package]
name = "burrete-compute-metal"
version = "0.1.0"
edition = "2021"

[dependencies]
burrete-compute-core = { path = "../burrete-compute-core" }
burrete-compute-protocol = { path = "../burrete-compute-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc = "0.2"

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
